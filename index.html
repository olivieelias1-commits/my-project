<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HustleHub Pro+</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:radial-gradient(1200px at 20% 10%, #1e293b 0%, #0f172a 50%, #020617 100%);min-height:100vh;color:white}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:rgba(255,255,255,0.06);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:32px;width:100%;max-width:380px}
.input{width:100%;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:14px 16px;color:white;margin-bottom:12px;outline:none}
.btn-primary{width:100%;background:linear-gradient(90deg,#8b5cf6,#3b82f6);border:none;padding:14px;border-radius:12px;color:white;font-weight:700;cursor:pointer}
.dashboard{max-width:480px;margin:0 auto;padding:20px;display:none}
.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.stat{background:linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));border:1px solid rgba(255,255,255,0.08);border-radius:18px;padding:18px}
.stat span{font-size:13px;opacity:0.6;display:block;margin-bottom:6px}
.stat b{font-size:26px;font-weight:800}
.chart-card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:18px;padding:16px;margin-bottom:18px}
.table-card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:18px;overflow:hidden}
.row{display:grid;grid-template-columns:1.2fr 1fr 0.9fr 30px;gap:8px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,0.06);font-size:13px;align-items:center}
.row.head{opacity:0.5;font-size:11px;font-weight:600;text-transform:uppercase;background:rgba(255,255,255,0.03)}
.badge{padding:4px 8px;border-radius:20px;font-size:11px;font-weight:600}
.badge.contacted{background:rgba(96,165,250,0.2);color:#60a5fa}
.badge.interested{background:rgba(251,191,36,0.2);color:#fbbf24}
.badge.new{background:rgba(52,211,153,0.2);color:#34d399}
.badge.closed{background:rgba(139,92,246,0.25);color:#a78bfa}
.actions{display:flex;gap:10px;margin-top:18px}
.btn{border:none;padding:13px 18px;border-radius:12px;font-weight:700;font-size:13px;cursor:pointer;flex:1}
.btn-add{background:linear-gradient(90deg,#8b5cf6,#7c3aed);color:white}
.btn-pitch{background:rgba(255,255,255,0.1);color:white;border:1px solid rgba(255,255,255,0.1)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:20px;z-index:50}
.modal.active{display:flex}
.modal-box{background:#111827;border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:24px;width:100%;max-width:380px}
.pitch-box{background:rgba(139,92,246,0.1);border:1px dashed rgba(139,92,246,0.4);border-radius:12px;padding:14px;font-size:13px;line-height:1.6;margin:12px 0;white-space:pre-wrap}
.search-box{display:flex;gap:8px;margin-bottom:14px}
.del{cursor:pointer;opacity:0.4}
.del:hover{opacity:1;color:#f87171}
</style>
</head>
<body>
<div id="loginScreen" class="login-wrap">
<div class="login-card">
<h1 style="font-size:28px;font-weight:800;margin-bottom:6px;background:linear-gradient(90deg,#a78bfa,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent">HustleHub Pro+</h1>
<p style="opacity:0.6;font-size:14px;margin-bottom:24px">Level 3 Dashboard with Analytics</p>
<input id="loginEmail" class="input" placeholder="Email" value="olivie@hustlehub.com">
<input id="loginPass" type="password" class="input" placeholder="Password" value="1234">
<button class="btn-primary" onclick="login()">Unlock Dashboard →</button>
</div>
</div>
<div id="dashScreen" class="dashboard">
<div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0 20px"><h2>My Hustle Dashboard</h2><span onclick="logout()" style="font-size:12px;opacity:0.6;background:rgba(255,255,255,0.1);padding:6px 12px;border-radius:20px;cursor:pointer">Logout</span></div>
<p id="welcomeText" style="opacity:0.6;font-size:13px;margin-bottom:14px">Welcome</p>
<div class="card-grid">
<div class="stat"><span>Leads</span><b id="leadsCount">0</b></div>
<div class="stat"><span>Pipeline</span><b id="pipeCount">$0</b></div>
<div class="stat"><span>Deals</span><b id="dealsCount">0</b></div>
<div class="stat"><span>Earnings</span><b id="earnCount" style="color:#34d399">$0</b></div>
</div>
<div class="chart-card"><div style="display:flex;justify-content:space-between;margin-bottom:10px"><b style="font-size:13px">Earnings Growth</b><span style="font-size:11px;opacity:0.5">Last 7 days</span></div><canvas id="earnChart" height="140"></canvas></div>
<div class="search-box"><input id="search" class="input" style="margin:0" placeholder="🔍 Search business..." oninput="render()"><button onclick="render()" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.1);border-radius:12px;color:white;padding:0 16px">Go</button></div>
<div style="font-weight:700;margin:10px 0 12px">Recent prospects</div>
<div class="table-card" id="prospectsTable"></div>
<div class="actions"><button class="btn btn-add" onclick="openModal('leadModal')">+ Add Lead</button><button class="btn btn-pitch" onclick="openModal('pitchModal')">🤖 Pitch</button></div>
</div>
<div id="leadModal" class="modal" onclick="if(event.target==this)closeModal('leadModal')"><div class="modal-box"><h3>Add New Lead</h3><input id="bizName" class="input" placeholder="Business name e.g. Kampala Cafe"><select id="service" class="input"><option>Google Reviews</option><option>AI Customer Replies</option><option>Digital Marketing</option><option>Website Design</option><option>WhatsApp Bot</option></select><select id="status" class="input"><option>New Lead</option><option>Contacted</option><option>Interested</option><option>Closed</option></select><input id="dealValue" type="number" class="input" placeholder="Deal value $ e.g. 80"><button class="btn-primary" onclick="addLead()">Save Lead</button></div></div>
<div id="pitchModal" class="modal" onclick="if(event.target==this)closeModal('pitchModal')"><div class="modal-box"><h3>AI Pitch Generator</h3><input id="pitchBiz" class="input" placeholder="Business name"><select id="pitchService" class="input"><option>Google Reviews</option><option>AI Customer Replies</option><option>Digital Marketing</option><option>Website Design</option><option>WhatsApp Bot</option></select><button class="btn-primary" onclick="generatePitch()">Generate Magic Pitch ✨</button><div id="pitchResult" class="pitch-box" style="display:none"></div><button id="copyBtn" style="display:none" class="btn btn-add" onclick="copyPitch()">Copy to WhatsApp</button></div></div>
<script>
let leads=JSON.parse(localStorage.getItem('hustle_leads')||'[{"biz":"Local Restaurant","service":"Google Reviews","status":"Contacted","value":80},{"biz":"Retail Shop","service":"AI Customer Replies","status":"Interested","value":120},{"biz":"Property Business","service":"Digital Marketing","status":"New Lead","value":80}]');
let isLogged=localStorage.getItem('hustle_logged')==='1';
let chart;
function init(){if(isLogged)showDash();render();}
function login(){localStorage.setItem('hustle_logged','1');localStorage.setItem('hustle_email',document.getElementById('loginEmail').value);showDash();}
function showDash(){document.getElementById('loginScreen').style.display='none';document.getElementById('dashScreen').style.display='block';document.getElementById('welcomeText').innerText='Welcome back, '+(localStorage.getItem('hustle_email')||'olivie').split('@')[0];setTimeout(drawChart,200);}
function logout(){localStorage.removeItem('hustle_logged');location.reload();}
function drawChart(){
 const ctx=document.getElementById('earnChart').getContext('2d');
 if(chart)chart.destroy();
 let earn=leads.reduce((a,l)=>a+(l.status==='Closed'?+l.value:l.status==='Interested'?+l.value*0.2:0),0);
 chart=new Chart(ctx,{type:'line',data:{labels:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],datasets:[{data:[0,earn*0.2,earn*0.4,earn*0.6,earn*0.8,earn*0.9,earn],borderColor:'#8b5cf6',backgroundColor:'rgba(139,92,246,0.2)',fill:true,tension:0.4}]},options:{plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{color:'#64748b'}},y:{grid:{color:'rgba(255,255,255,0.06)'},ticks:{color:'#64748b'}}}}});
}
function render(){
 const q=(document.getElementById('search')?.value||'').toLowerCase();
 const table=document.getElementById('prospectsTable');table.innerHTML='<div class="row head"><div>Business</div><div>Service</div><div>Status</div><div></div></div>';
 let clients=0,deals=0,earnings=0,pipe=0;
 leads.filter(l=>l.biz.toLowerCase().includes(q)||l.service.toLowerCase().includes(q)).forEach((l,i)=>{
  if(l.status==='Interested'||l.status==='Closed')clients++;
  if(l.status==='Closed'){deals++;earnings+=parseInt(l.value)||0;}
  else if(l.status==='Interested')earnings+=(parseInt(l.value)||0)*0.2;
  pipe+=parseInt(l.value)||0;
  const c=l.status==='Contacted'?'contacted':l.status==='Interested'?'interested':l.status==='New Lead'?'new':'closed';
  table.innerHTML+=`<div class="row"><div>${l.biz}</div><div>${l.service}</div><div><span class="badge ${c}">${l.status}</span></div><div class="del" onclick="deleteLead(${leads.indexOf(l)})">✕</div></div>`;
 });
 document.getElementById('leadsCount').innerText=leads.length;
 document.getElementById('pipeCount').innerText='$'+pipe;
 document.getElementById('dealsCount').innerText=deals;
 document.getElementById('earnCount').innerText='$'+Math.round(earnings);
 if(chart)drawChart();
}
function deleteLead(idx){if(confirm('Delete this lead?')){leads.splice(idx,1);localStorage.setItem('hustle_leads',JSON.stringify(leads));render();}}
function openModal(id){document.getElementById(id).classList.add('active');}
function closeModal(id){document.getElementById(id).classList.remove('active');}
function addLead(){const biz=document.getElementById('bizName').value;const service=document.getElementById('service').value;const status=document.getElementById('status').value;const value=document.getElementById('dealValue').value||80;if(!biz){alert('Enter business name');return}leads.unshift({biz,service,status,value});localStorage.setItem('hustle_leads',JSON.stringify(leads));document.getElementById('bizName').value='';closeModal('leadModal');render();}
function generatePitch(){const biz=document.getElementById('pitchBiz').value||'your business';const service=document.getElementById('pitchService').value;const t={'Google Reviews':`Hi ${biz} team! 👋\n\nI noticed you have amazing food but only few Google reviews. I help restaurants get 50+ 5-star reviews in 30 days.\n\nAutomated via WhatsApp. No extra work.\n\nCan I show 2-min demo tomorrow? Free.\n\n- Olivie | HustleHub`,'AI Customer Replies':`Hello ${biz}! 🚀\n\nI saw you reply manually to customers. What if AI replies instantly 24/7?\n\nMy bot increases bookings 30%. Answers price, location, menu auto.\n\nFree test 3 days?\n\n- Olivie`,'Digital Marketing':`Hi ${biz}! 📈\n\nI help Kampala businesses get 20-40 new customers monthly via TikTok + Google Ads.\n\n100k UGX = 15k reach.\n\nCan I send example ad?\n\n- Olivie`,'Website Design':`Hi ${biz}! 💻\n\nYour Instagram is great but you lose customers without a site that takes orders.\n\nI build fast sites live in 24hrs, mobile-first, WhatsApp orders.\n\nFree preview tonight?\n\n- Olivie`,'WhatsApp Bot':`Hi ${biz}! 🤖\n\nCustomers ask same questions on WhatsApp. I automate it.\n\nBot answers, takes orders, even while you sleep. Saves 3hrs daily.\n\n15 mins setup. Free trial 7 days.\n\nSet up tomorrow?\n\n- Olivie`};const box=document.getElementById('pitchResult');box.style.display='block';box.innerText=t[service];document.getElementById('copyBtn').style.display='block';window.lastPitch=t[service];}
function copyPitch(){navigator.clipboard.writeText(window.lastPitch);alert('Copied! Paste in WhatsApp');}
init();
</script>
</body>
</html>
