<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Remote 1M Nyendo</title><style>body{background:#0f0f12;color:#fff;font-family:system-ui;padding:12px;padding-bottom:100px;margin:0}.card{background:#1e1e24;border-radius:16px;padding:14px;margin:10px 0;border:1px solid #2a2a32}.momo{background:#ff0000;color:#fff;padding:10px;border-radius:20px;text-align:center;font-weight:bold}.goal{background:linear-gradient(135deg,#1e1e24,#2a1a4a);border-radius:16px;padding:14px;margin:10px 0}.bar{background:#333;height:8px;border-radius:4px;margin-top:8px}.fill{background:linear-gradient(90deg,#8a5cf6,#3b82f6);height:8px;border-radius:4px;width:0%}.row{display:flex;justify-content:space-between;align-items:center;background:#2a2a32;padding:10px;border-radius:10px;margin:6px 0}.btn{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,#8a5cf6,#3b82f6);color:#fff;border:none;padding:14px 28px;border-radius:30px;font-weight:bold;width:90%;max-width:400px}</style></head><body><div class="momo">Airtel Money: 0740930892 - 150k Setup / 50k Monthly</div><div class="goal"><div style="display:flex;justify-content:space-between"><span>🎯 Weekly Goal: 1,000,000 UGX</span><span id="pct">0%</span></div><div class="bar"><div class="fill" id="fill"></div></div><div style="font-size:12px;color:#aaa;margin-top:6px" id="txt">0 / 1,000,000 - Keep hustling from Nyendo!</div></div><div class="card"><b>Earnings Growth - Last 7 days</b><div id="chart" style="height:60px;display:flex;align-items:end;gap:4px;margin-top:10px"></div></div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>Recent prospects - Remote</b><span style="font-size:11px;color:#888">Tap ✅ when paid to 0740930892</span></div><div id="list" style="margin-top:10px"></div></div><button class="btn" onclick="add()">+ Add Lead - From Maps</button><script>
let data=JSON.parse(localStorage.getItem('nyendo_final')||'[{"name":"Salon","phone":"075...","deal":"AI Replies - 150k","status":"New Lead"},{"name":"Semblable Chicken Grill","phone":"070...","deal":"AI Replies - 150k","status":"New Lead"}]');
function render(){let list=document.getElementById('list');list.innerHTML='';let total=0;let counts={};data.forEach(d=>{if(d.status==='Closed'){total+=150000;counts[d.name]=1}});let pct=Math.min(100,Math.round(total/1000000*100));document.getElementById('pct').innerText=pct+'%';document.getElementById('fill').style.width=pct+'%';document.getElementById('txt').innerText=total.toLocaleString()+' / 1,000,000 - '+(pct>=100?'1M DONE! 🎉':'Keep hustling from Nyendo!');let ch=document.getElementById('chart');ch.innerHTML='';let v=0;for(let i=0;i<7;i++){v+=total/7;let h=document.createElement('div');h.style.flex='1';h.style.background='linear-gradient(#8a5cf6,#3b82f6)';h.style.height=(10+v/5000)+'px';h.style.borderRadius='4px';ch.appendChild(h)};data.slice().reverse().forEach((d,i)=>{let idx=data.length-1-i;let div=document.createElement('div');div.className='row';let st=d.status==='Closed'?'background:#4a2a8a;color:#fff;padding:4px 10px;border-radius:12px;font-size:11px':'background:#333;color:#aaa;padding:4px 10px;border-radius:12px;font-size:11px';div.innerHTML=`<div><b>${d.name}</b><br><span style="font-size:11px;color:#888">${d.deal} - ${d.phone}</span></div><div style="display:flex;gap:6px;align-items:center"><span style="${st}">${d.status}</span><button onclick="closeDeal(${idx})" style="background:${d.status==='Closed'?'#00ff88':'#25D366'};border:none;border-radius:50%;width:32px;height:32px">💬</button></div>`;list.appendChild(div)});localStorage.setItem('nyendo_final',JSON.stringify(data))}
function closeDeal(i){if(data[i].status==='Closed'){if(confirm('Mark as not paid?')){data[i].status='New Lead'}}else{if(confirm('Paid 150k to Airtel 0740930892?')){data[i].status='Closed'}}render()}
function add(){let n=prompt('Business name from Maps? (e.g Salon Nyendo)');if(!n)return;let p=prompt('Phone from Maps? (e.g 0751234567)');if(!p)return;data.push({name:n,phone:p,deal:'AI Replies - 150k',status:'New Lead'});render()}
render();
</script></body></html>
