<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HustleHub Dashboard</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0f0f17;
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
}

.container{
  max-width:850px;
  margin:auto;
}

h1{
  margin-bottom:5px;
}

.subtitle{
  color:#999;
  margin-bottom:25px;
}

.card{
  background:#1d1d27;
  border:1px solid #30303d;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
}

.goal{
  background:linear-gradient(135deg,#29234e,#17213e);
  border:1px solid #4b3c86;
}

.goal-top{
  display:flex;
  justify-content:space-between;
  font-size:18px;
  font-weight:bold;
}

.progress{
  height:14px;
  background:#363647;
  border-radius:20px;
  margin:18px 0 10px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:48%;
  background:linear-gradient(90deg,#9b4dff,#3b82f6);
  border-radius:20px;
}

.muted{
  color:#aaa;
}

h2{
  margin-top:0;
}

.chart{
  height:210px;
  display:flex;
  align-items:flex-end;
  gap:10px;
  padding:15px 5px 5px;
}

.bar-wrap{
  flex:1;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;
}

.bar{
  width:75%;
  max-width:55px;
  background:linear-gradient(#914dff,#5130a8);
  border-radius:8px 8px 0 0;
}

.day{
  color:#999;
  font-size:12px;
  margin-top:7px;
}

.search{
  display:flex;
  gap:10px;
}

input,select{
  width:100%;
  padding:15px;
  border-radius:12px;
  border:1px solid #393947;
  background:#171720;
  color:white;
  font-size:16px;
}

button{
  border:0;
  border-radius:12px;
  padding:14px 20px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.go{
  background:#653cff;
  color:white;
}

.add{
  width:100%;
  background:linear-gradient(90deg,#914dff,#4285ff);
  color:white;
  margin-top:10px;
}

.lead{
  border-top:1px solid #30303d;
  padding:17px 0;
}

.lead:first-child{
  border-top:0;
}

.lead-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.lead-name{
  font-size:18px;
  font-weight:bold;
}

.badge{
  background:#653c9e;
  padding:7px 12px;
  border-radius:20px;
  font-size:12px;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.whatsapp{
  background:#20d66b;
  color:white;
  flex:1;
}

.close{
  background:#30303a;
  color:white;
}

.empty{
  color:#888;
  text-align:center;
  padding:20px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-box{
  background:#1d1d27;
  border:1px solid #393947;
  border-radius:18px;
  padding:22px;
  width:100%;
  max-width:430px;
}

.modal-box input{
  margin-bottom:12px;
}

.cancel{
  background:#33333e;
  color:white;
  width:100%;
  margin-top:8px;
}

.save{
  background:#653cff;
  color:white;
  width:100%;
}

.footer{
  text-align:center;
  color:#666;
  margin:25px 0;
  font-size:13px;
}
</style>
</head>

<body>

<div class="container">

<h1>🚀 HustleHub</h1>
<div class="subtitle">Find businesses. Get leads. Grow your hustle.</div>

<!-- WEEKLY GOAL -->
<div class="card goal">
  <div class="goal-top">
    <span>🎯 Weekly Goal: $500</span>
    <span id="percent">48%</span>
  </div>

  <div class="progress">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="muted">
    <span id="earned">$240</span> / $500 — Keep hustling!
  </div>
</div>

<!-- EARNINGS -->
<div class="card">
  <h2>📈 Earnings Growth</h2>
  <div class="muted">Last 7 days</div>

  <div class="chart">
    <div class="bar-wrap">
      <div class="bar" style="height:15px"></div>
      <div class="day">Mon</div>
    </div>

    <div class="bar-wrap">
      <div class="bar" style="height:45px"></div>
      <div class="day">Tue</div>
    </div>

    <div class="bar-wrap">
      <div class="bar" style="height:80px"></div>
      <div class="day">Wed</div>
    </div>

    <div class="bar-wrap">
      <div class="bar" style="height:125px"></div>
      <div class="day">Thu</div>
    </div>

    <div class="bar-wrap">
      <div class="bar" style="height:160px"></div>
      <div class="day">Fri</div>
    </div>

    <div class="bar-wrap">
      <div class="bar" style="height:200px"></div>
      <div class="day">Sat</div>
    </div>

    <div class="bar-wrap">
      <div class="bar" style="height:240px"></div>
      <div class="day">Sun</div>
    </div>
  </div>
</div>

<!-- SEARCH -->
<div class="card">
  <h2>🔎 Find a Business</h2>

  <div class="search">
    <input id="searchInput" placeholder="Search business...">
    <button class="go" onclick="searchBusiness()">Go</button>
  </div>

  <p class="muted" id="searchResult"></p>
</div>

<!-- LEADS -->
<div class="card">
  <h2>👥 Recent Prospects</h2>

  <div id="leads"></div>

  <button class="add" onclick="openModal()">＋ Add Lead</button>
</div>

<div class="footer">
  HustleHub • Your business growth dashboard
</div>

</div>


<!-- ADD LEAD MODAL -->
<div class="modal" id="modal">

  <div class="modal-box">

    <h2>➕ Add New Lead</h2>

    <input id="businessName" placeholder="Business name">

    <input id="businessPhone" placeholder="WhatsApp number">

    <input id="businessService" placeholder="Service / offer">

    <input id="businessPrice" placeholder="Price e.g. $80">

    <button class="save" onclick="saveLead()">Save Lead</button>

    <button class="cancel" onclick="closeModal()">Cancel</button>

  </div>

</div>


<script>

let leads = JSON.parse(localStorage.getItem("hustlehub_leads")) || [

{
 name:"Salon",
 phone:"",
 service:"AI Customer Replies",
 price:"$80",
 status:"Closed"
},

{
 name:"Sembabule Chicken Grill",
 phone:"",
 service:"AI Customer Replies",
 price:"$80",
 status:"Closed"
},

{
 name:"Sembabule Chicken Grill",
 phone:"",
 service:"AI Customer Replies",
 price:"$80",
 status:"Closed"
},

{
 name:"Sembabule Chicken Grill",
 phone:"",
 service:"AI Customer Replies",
 price:"$100",
 status:"New Lead"
}

];


function displayLeads(list = leads){

  const box = document.getElementById("leads");

  if(list.length === 0){

    box.innerHTML =
      '<div class="empty">No leads found.</div>';

    return;
  }

  box.innerHTML = list.map((lead,index)=>`

    <div class="lead">

      <div class="lead-top">

        <div>
          <div class="lead-name">${lead.name}</div>

          <div class="muted">
            ${lead.service} — ${lead.price}
          </div>
        </div>

        <div class="badge">
          ${lead.status}
        </div>

      </div>

      <div class="actions">

        <button class="whatsapp"
          onclick="openWhatsApp('${lead.phone}')">
          💬 WhatsApp
        </button>

        <button class="close"
          onclick="removeLead(${index})">
          ✕
        </button>

      </div>

    </div>

  `).join("");

}


function openWhatsApp(phone){

  if(!phone){

    alert("This lead does not have a WhatsApp number yet.");

    return;
  }

  let number = phone.replace(/\D/g,'');

  if(number.startsWith("0")){
    number = "256" + number.substring(1);
  }

  window.open(
    "https://wa.me/" + number,
    "_blank"
  );

}


function openModal(){

  document.getElementById("modal").style.display="flex";

}


function closeModal(){

  document.getElementById("modal").style.display="none";

}


function saveLead(){

  const name =
    document.getElementById("businessName").value.trim();

  const phone =
    document.getElementById("businessPhone").value.trim();

  const service =
    document.getElementById("businessService").value.trim();

  const price =
    document.getElementById("businessPrice").value.trim();

  if(!name){

    alert("Please enter the business name.");

    return;
  }

  leads.unshift({

    name:name,

    phone:phone,

    service:service || "AI Customer Replies",

    price:price || "$80",

    status:"New Lead"

  });

  localStorage.setItem(
    "hustlehub_leads",
    JSON.stringify(leads)
  );

  displayLeads();

  document.getElementById("businessName").value="";
  document.getElementById("businessPhone").value="";
  document.getElementById("businessService").value="";
  document.getElementById("businessPrice").value="";

  closeModal();

}


function removeLead(index){

  leads.splice(index,1);

  localStorage.setItem(
    "hustlehub_leads",
    JSON.stringify(leads)
  );

  displayLeads();

}


function searchBusiness(){

  const query =
    document.getElementById("searchInput").value
    .toLowerCase()
    .trim();

  if(!query){

    displayLeads();

    document.getElementById("searchResult").textContent="";

    return;
  }

  const results = leads.filter(lead =>
    lead.name.toLowerCase().includes(query) ||
    lead.service.toLowerCase().includes(query)
  );

  displayLeads(results);

  document.getElementById("searchResult").textContent =
    results.length +
    " business(es) found in your leads.";

}


displayLeads();

</script>

</body>
</html>
