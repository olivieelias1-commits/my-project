<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Hustle Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f13;color:#fff;font-family:Arial;padding:14px;padding-bottom:120px}
.top{display:flex;justify-content:space-between;align-items:center;margin:8px 0 16px}
.top h1{font-size:22px;font-weight:800}
.btn-logout{background:#2a2a35;color:#aaa;border:none;padding:8px 14px;border-radius:20px;font-size:12px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:#1c1c25;border:1px solid #2b2b38;border-radius:16px;padding:14px}
.stat .label{font-size:11px;color:#8a8aa0}
.stat .val{font-size:22px;font-weight:900;margin-top:6px}
.val.green{color:#00ff88}
.goal{background:linear-gradient(135deg,#1e1e38,#2a2250);border:1px solid #3a3a5a;border-radius:16px;padding:14px;margin-bottom:14px}
.goal-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px}
.progress{height:8px;background:#2a2a3f;border-radius:10px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,#8b5cf6,#3b82f6);width:0%;border-radius:10px;transition:0.5s}
.card{background:#1c1c25;border:1px solid #2b2b38;border-radius:16px;padding:14px;margin-bottom:14px}
.search-row{display:flex;gap:8px;margin-bottom:14px}
.search-row input{flex:1;background:#1c1c25;border:1px solid #2b2b38;border-radius:20px;padding:12px 16px;color:#fff;outline:none}
.search-row button{background:#2a2a35;border:none;color:#fff;padding:12px 18px;border-radius:20px;font-weight:700}
.prospect{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #2b2b38}
.pname{font-size:13px;font-weight:700}
.pdesc{font-size:11px;color:#8a8aa0;margin-top:2px}
.p-right{display:flex;gap:6px;align-items:center}
.badge{padding:6px 10px;border-radius:20px;font-size:10px;font-weight:800;border:none;cursor:pointer}
.badge.new{background:#2a2a35;color:#aaa}
.badge.paid{background:#00ff88;color:#000}
.icon-btn{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer}
.icon-wa{background:#25D366}
.icon-del{background:#2a2a35;color:#aaa}
.fab{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#8b5cf6,#3b82f6);color:#fff;border:none;padding:16px 28px;border-radius:30px;font-weight:800;font-size:14px}
canvas{width:100%;height:120px;margin-top:10px}
</style>
</head>
<body>
<div class="top"><h1>My Hustle Dashboard</h1><button class="btn-logout">Logout</button></div>
<div class="grid4">
<div class="stat"><div class="label">Leads</div><div class="val" id="cLeads">4</div></div>
<div class="stat"><div class="label">Pipeline</div><div class="val" id="cPipe">600k UGX</div></div>
<div class="stat"><div class="label">Deals</div><div class="val" id="cDeals">0</div></div>
<div class="stat"><div class="label">Earnings</div><div class="val green" id="cEarn">0 UGX</div></div>
</div>
<div class="goal">
<div class="goal-top"><span>🎯 Weekly Goal: 1,000,000 UGX</span><span id="pct">0%</span></div>
<div class="progress"><div class="fill" id="fill"></div></div>
<div style="font-size:11px;color:#8a8aa0;margin-top:8px" id="goalText">0 / 1,000,000 - Keep hustling!</div>
</div>
<div class="card">
<div style="display:flex;justify-content:space-between"><b style="font-size:14px">Earnings Growth</b><span style="font-size:11px;color:#8a8aa0">Last 7 days</span></div>
<canvas id="chart"></canvas>
<div style="display:flex;justify-content:space-between;font-size:10px;color:#8a8aa0;margin-top:4px"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
</div>
<div class="search-row"><input id="search" placeholder="🔍 Search business..." oninput="render()"><button onclick="render()">Go</button></div>
<div class="card"><b style="font-size:14px">Recent prospects</b><div id="list" style="margin-top:10px"></div></div>
<button class="fab" onclick="addLead()">+ Add Lead</button>
<script>
let goal=1000000;let leads=[{name:"Salon",desc:"AI Customer Replies",status:"NEW"},{name:"Semblable Chicken Grill",desc:"Masaka",status:"NEW"},{name:"Elsie Hotel Masaka",desc:"Hotel - Masaka Town",status:"NEW"},{name:"Victory Hotel Masaka",desc:"Hotel - Nyendo",status:"NEW"}];
let earnings=[0,0,0,0,0,0,0];let total=0;
function drawChart(){const c=document.getElementById('chart');const ctx=c.getContext('2d');c.width=c.offsetWidth*2;c.height=120*2;ctx.clearRect(0,0,c.width,c.height);ctx.strokeStyle='#8b5cf6';ctx.lineWidth=4;ctx.beginPath();const max=Math.max(...earnings,100000);earnings.forEach((v,i)=>{let x=i/(earnings.length-1)*c.width;let y=c.height - (v/max)*c.height*0.8 - 10;if(i==0)ctx.moveTo(x,y); else ctx.lineTo(x,y);});ctx.stroke();ctx.fillStyle='#8b5cf6';earnings.forEach((v,i)=>{let x=i/(earnings.length-1)*c.width;let y=c.height - (v/max)*c.height*0.8 - 10;ctx.beginPath();ctx.arc(x,y,8,0,Math.PI*2);ctx.fill();});}
function render(){let q=document.getElementById('search').value.toLowerCase();let html='';leads.filter(l=>l.name.toLowerCase().includes(q)).forEach((l)=>{let idx=leads.indexOf(l);html+=`<div class="prospect"><div><div class="pname">${l.name}</div><div class="pdesc">${l.desc} - <b>${l.status}</b></div></div><div class="p-right"><button class="badge ${l.status==='PAID'?'paid':'new'}" onclick="togglePaid(${idx})">${l.status==='PAID'?'PAID ✓':'NEW'}</button><button class="icon-btn icon-wa" onclick="copyMsg('${l.name}')">💬</button><button class="icon-btn icon-del" onclick="removeLead(${idx})">✕</button></div></div>`;});document.getElementById('list').innerHTML=html;let paid=leads.filter(l=>l.status==='PAID').length;document.getElementById('cLeads').innerText=leads.length;document.getElementById('cDeals').innerText=paid;document.getElementById('cEarn').innerText=total.toLocaleString()+' UGX';document.getElementById('cPipe').innerText=(leads.length*150000).toLocaleString()+' UGX';let pct=Math.min(100,Math.round(total/goal*100));document.getElementById('fill').style.width=pct+'%';document.getElementById('pct').innerText=pct+'%';document.getElementById('goalText').innerText=total.toLocaleString()+' / '+goal.toLocaleString()+' - '+(pct>=100?'GOAL HIT! 🔥':'Keep hustling!');}
function togglePaid(i){if(leads[i].status!=='PAID'){leads[i].status='PAID';total+=150000;earnings[6]+=150000;}else{leads[i].status='NEW';total-=150000;earnings[6]-=150000;if(total<0)total=0;if(earnings[6]<0)earnings[6]=0;}render();drawChart();}
function removeLead(i){if(confirm('Delete '+leads[i].name+'?')){if(leads[i].status==='PAID'){total-=150000;earnings[6]-=150000;if(total<0)total=0;}leads.splice(i,1);render();drawChart();}}
function addLead(){let n=prompt('Business name?');if(!n)return;let d=prompt('Note?','Masaka');leads.push({name:n,desc:d||'Masaka',status:'NEW'});render();drawChart();}
function copyMsg(name){let msg=`Hello 👋, is this ${name}?\n\nI'm Olivie from Nyendo. I help Masaka businesses reply instantly on WhatsApp, even at 2am.\n\nI made a 30-sec demo for your business. Can I send it?`;navigator.clipboard.writeText(msg);alert('Copied for '+name+'!');}
render();drawChart();
</script>
</body>
</html>
