<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Hustle Tracker 1M</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0d12;color:#fff;font-family:Arial;padding:14px;padding-bottom:110px}
.top{display:flex;justify-content:space-between;align-items:center;margin:10px 0 16px}
.card{background:#191923;border:1px solid #2c2c3a;border-radius:18px;padding:16px;margin-bottom:14px}
.small{font-size:11px;color:#8a8a9a;letter-spacing:0.5px}
.big{font-size:28px;font-weight:900;margin-top:4px}
.bar{height:12px;background:#262636;border-radius:10px;overflow:hidden;margin-top:12px}
.fill{height:100%;background:linear-gradient(90deg,#00ff88,#5e9eff);width:0%;transition:0.5s}
.grid{display:flex;gap:10px;margin-bottom:14px}
.box{flex:1;background:#191923;border:1px solid #2c2c3a;border-radius:16px;padding:14px;text-align:center}
.box b{font-size:18px;display:block;margin-top:4px}
.lead{display:flex;justify-content:space-between;align-items:center;background:#232333;padding:14px;border-radius:14px;margin-top:10px}
.tag{padding:7px 14px;border-radius:20px;font-size:12px;font-weight:800;cursor:pointer}
.new{background:#2c2c3a;color:#aaa}
.paid{background:#00ff88;color:#000}
.msgBox{background:#111119;border:1px solid #2c2c3a;border-radius:14px;padding:12px;font-size:13px;line-height:1.6;white-space:pre-wrap;margin-top:10px;min-height:100px}
.btnCopy{width:100%;background:#25D366;color:#fff;border:none;padding:12px;border-radius:12px;font-weight:800;margin-top:10px}
.btnAdd{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:92%;max-width:420px;background:#fff;color:#000;border:none;padding:18px;border-radius:30px;font-weight:900;font-size:15px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.t{padding:8px 10px;background:#232333;border-radius:10px;font-size:11px;font-weight:700;cursor:pointer}
.t.on{background:#fff;color:#000}
</style>
</head>
<body>

<div class="top">
<div style="font-weight:900;font-size:20px">💼 MY HUSTLE</div>
<div style="background:#FFD700;color:#000;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:900">GOAL 1M UGX</div>
</div>

<div class="card">
<div class="small">TOTAL EARNED</div>
<div class="big" id="total">0 UGX</div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div style="display:flex;justify-content:space-between;margin-top:8px" class="small"><span id="pct">0%</span><span id="need">Need 1,000,000</span></div>
</div>

<div class="grid">
<div class="box"><div class="small">LEADS</div><b id="cLeads">2</b></div>
<div class="box"><div class="small">PAID</div><b id="cPaid" style="color:#00ff88">0</b></div>
<div class="box"><div class="small">REMAINING</div><b id="cRem">1M</b></div>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between"><b style="font-size:14px">Prospects</b><span class="small">tap NEW to mark PAID</span></div>
<div id="list"></div>
</div>

<div class="card">
<div class="tabs">
<div class="t on" id="t0" onclick="showMsg(0)">1st Message</div>
<div class="t" id="t1" onclick="showMsg(1)">After YES</div>
<div class="t" id="t2" onclick="showMsg(2)">Payment</div>
</div>
<div class="msgBox" id="msg"></div>
<button class="btnCopy" onclick="copyNow()">📋 COPY THIS MESSAGE</button>
</div>

<button class="btnAdd" onclick="addNew()">+ Add Business From Maps</button>

<script>
let goal=1000000;
let total=0;
let leads=[
{name:"Elsie Hotel Masaka",status:"NEW"},
{name:"Victory Hotel Masaka",status:"NEW"}
];

let msgs=[
`Hello 👋, is this your business on Google Maps?

I'm Olivie from Nyendo. I help Masaka businesses get more customers by replying instantly to WhatsApp messages, even at 2am.

I made a 30-sec demo for your business. Can I send it?`,

`Great! It answers menu, prices, location and takes orders 24/7 automatically.

Setup is 150k once, then 50k monthly to keep it running. I install it remotely in 1 hour.

Do you have 5 minutes for a quick call?`,

`Thank you! 🙏

Setup is 150k. Please send to:
Airtel Money: 0740930892 (Olivie Elias)
Send screenshot after.

I will setup in 1 hour and show you how it works!`
];

let cur=0;
function showMsg(i){
cur=i;
document.getElementById('msg').innerText=msgs[i];
document.querySelectorAll('.t').forEach((e,idx)=>{e.className=idx===i?'t on':'t'});
}
function copyNow(){
navigator.clipboard.writeText(msgs[cur]);
alert('Copied! Now paste on WhatsApp');
}
function draw(){
let h='';
leads.forEach((l,i)=>{
h+=`<div class="lead"><div><b style="font-size:13px">${l.name}</b><div class="small">${l.status}</div></div><div class="tag ${l.status==='PAID'?'paid':'new'}" onclick="paid(${i})">${l.status==='PAID'?'PAID ✓':'NEW'}</div></div>`;
});
document.getElementById('list').innerHTML=h;
document.getElementById('total').innerText=total.toLocaleString()+' UGX';
document.getElementById('fill').style.width=(total/goal*100)+'%';
document.getElementById('pct').innerText=Math.round(total/goal*100)+'%';
document.getElementById('need').innerText=total>=goal?'GOAL REACHED 🔥':'Need '+(goal-total).toLocaleString();
document.getElementById('cLeads').innerText=leads.length;
document.getElementById('cPaid').innerText=leads.filter(x=>x.status==='PAID').length;
document.getElementById('cRem').innerText=(goal-total).toLocaleString();
}
function paid(i){
if(leads[i].status!=='PAID'){leads[i].status='PAID';total+=150000;}else{leads[i].status='NEW';total-=150000;if(total<0)total=0;}
draw();
}
function addNew(){
let n=prompt('Business name from Google Maps?');
if(n && n.trim()!==''){leads.push({name:n.trim(),status:'NEW'});draw();}
}
showMsg(0);
draw();
</script>
</body>
</html>
