<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Hustle Dashboard</title>
<style>
body{background:#0f0f13;color:white;font-family:sans-serif;margin:0;padding:16px}
.card{background:#1c1c22;padding:14px;border-radius:14px;margin-bottom:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
h1{font-size:22px;margin:8px 0}
.small{color:#aaa;font-size:12px}
.green{color:#2eff7a}
input{width:100%;padding:12px;border-radius:10px;border:0;background:#2a2a33;color:white;margin:6px 0;box-sizing:border-box}
button{padding:12px 16px;border-radius:20px;border:0;background:#7c5cff;color:white;font-weight:bold}
.top{display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div class="top"><h1>My Hustle Dashboard</h1><button onclick="localStorage.clear();location.reload()" style="background:#333">Logout</button></div>

<div class="row">
<div class="card">Leads<br><b id="leads">0</b></div>
<div class="card">Pipeline<br><b id="pipe">$0</b></div>
<div class="card">Deals<br><b id="deals">0</b></div>
<div class="card">Earnings<br><b id="earn" class="green">$0</b></div>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between"><span>🎯 Weekly Goal: $500</span><span id="pct">0%</span></div>
<div style="background:#333;height:6px;border-radius:10px;margin:8px 0"><div id="bar" style="height:6px;width:0%;background:#7c5cff;border-radius:10px"></div></div>
<div class="small" id="goalText">$0 / $500 - Keep hustling!</div>
</div>

<div class="card">
<input id="biz" placeholder="🔍 Search business...">
<button id="addLeadBtn">+ Add Lead</button>
<button id="fixBtn" style="background:#ff3b30;margin-top:8px;width:100%">🔄 FIX NaN BUG - TAP ME</button>
</div>

<div class="card" id="list"><b>Recent prospects</b><div id="prospects"></div></div>

<script>
let data = JSON.parse(localStorage.getItem('hustle')||'[]');
function toNum(v){ let n=Number(v); return isNaN(n)?0:n; }
function save(){ localStorage.setItem('hustle', JSON.stringify(data)); render(); }
function render(){
  let leads = data.length;
  let total = 0; let closed = 0;
  data.forEach(d=>{
    let amt = toNum(d.amount);
    total += amt;
    if(d.status==='closed') closed++;
  });
  // fix NaN
  if(isNaN(total)) total=0;
  if(isNaN(closed)) closed=0;
  let pct = Math.min(100, Math.round((total/500)*100)) || 0;
  
  document.getElementById('leads').innerText = leads;
  document.getElementById('pipe').innerText = '$'+total;
  document.getElementById('deals').innerText = closed;
  document.getElementById('earn').innerText = '$'+total;
  document.getElementById('pct').innerText = pct+'%';
  document.getElementById('bar').style.width = pct+'%';
  document.getElementById('goalText').innerText = '$'+total+' / $500 - Keep hustling!';
  
  let html='';
  data.forEach((d,i)=>{
    html+=`<div style="margin-top:10px;padding:8px;background:#2a2a33;border-radius:8px">${d.name||'Local Restaurant'} - $${toNum(d.amount)} <button onclick="del(${i})" style="padding:4px 8px;background:red">X</button></div>`;
  });
  document.getElementById('prospects').innerHTML=html||'<div class="small">No leads yet</div>';
}
window.del=(i)=>{ data.splice(i,1); save(); };
document.getElementById('addLeadBtn').onclick=()=>{
  let name = document.getElementById('biz').value || 'Local Business';
  let amt = prompt('Deal amount? Example: 100');
  let n = toNum(amt);
  if(!amt || isNaN(Number(amt))){ alert('Enter valid number like 100'); return; }
  data.push({name, amount:n, status:'open'});
  document.getElementById('biz').value=''; save();
};
document.getElementById('fixBtn').onclick=()=>{
  data = data.map(d=>({name:d.name||'Business', amount:toNum(d.amount), status:d.status||'open'})).filter(d=>!isNaN(d.amount));
  save(); alert('Fixed! NaN removed');
};
render();
</script>
</body>
</html>
